<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lyrics Reader</title>
    <style>
        /* CSS: DARK MODE DEFAULT, FONT GRANDI, UI MOBILE */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-main: #ffffff;
            --text-it: #ffca28;
            --accent: #1db954;
            --danger: #ff4444;
            --share: #2b78e4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px; 
        }

        /* MODALITA' LETTURA (Amici) */
        .read-only-mode .admin-only { display: none !important; }
        .admin-login-btn { display: none; }
        .read-only-mode .admin-login-btn { display: block; margin-top: 40px; background: transparent; color: #888; border: 1px solid #444; }

        header {
            background-color: var(--surface-color);
            padding: 10px 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .app-version {
            font-size: 0.8rem;
            color: #888;
            font-weight: normal;
            margin-top: 2px;
        }

        .container { padding: 20px; }
        
        .view { display: none; }
        .view.active { display: block; }

        button {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: var(--accent);
            color: #fff;
            margin-top: 10px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        button.secondary { background-color: #333; }
        button.danger { background-color: var(--danger); }
        button.share { background-color: var(--share); }
        button.small { width: auto; padding: 10px 15px; font-size: 1rem; }

        input, textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--surface-color);
            color: var(--text-main);
        }
        textarea { min-height: 150px; resize: vertical; }

        .list-item {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }
        .list-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .list-item-info h2 { font-size: 1.4rem; margin-bottom: 5px; }
        .list-item-info p { font-size: 1.1rem; color: #aaa; }

        .lyric-pair { margin-bottom: 25px; }
        .lyric-en { font-size: 1.6rem; font-weight: bold; line-height: 1.3; }
        .lyric-it { font-size: 1.4rem; color: var(--text-it); line-height: 1.3; margin-top: 8px; font-style: italic; }

        #loader { display: none; text-align: center; padding: 20px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <button class="small secondary" id="btnBack" style="display:none; width: 80px;" onclick="goBack()">◀ Indietro</button>
        <div class="header-title-container">
            <span id="appTitle">Lyrics Reader</span>
            <span class="app-version">v1.4</span>
        </div>
        <button class="small secondary admin-only" id="btnAddTop" style="display:none; width: 80px;" onclick="prepareNewTrack()">➕ Nuovo</button>
    </header>

    <div id="loader">Attendere prego...</div>

    <!-- VISTA 1: LOGIN (Mostrata solo manualmente o se forzata) -->
    <div id="loginView" class="view container">
        <h2>Accesso Autore</h2>
        <p style="margin-top:10px; color:#aaa; font-size:1.1rem;">Inserisci il tuo Personal Access Token per poter modificare il database.</p>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxx">
        <button onclick="saveTokenAndStart()">Salva e Accedi</button>
        <button class="secondary" onclick="goBack()" style="margin-top: 15px;">Annulla</button>
    </div>

    <!-- VISTA 2: LISTA ARTISTI (Home) -->
    <div id="homeView" class="view container">
        <button class="admin-only" onclick="prepareNewTrack()" style="margin-bottom: 20px;">➕ Aggiungi Nuovo Brano</button>
        <input type="text" id="localSearchQuery" placeholder="🔍 Cerca artista, disco o brano..." onkeyup="renderHome()">
        <div id="artistsList" style="margin-top: 20px;"></div>
        
        <!-- Appare solo in modalità lettura -->
        <button class="admin-login-btn" onclick="showView('loginView')">🔒 Accesso Autore (Login)</button>
    </div>

    <!-- VISTA 3: LISTA DISCHI DELL'ARTISTA -->
    <div id="artistView" class="view container">
        <h2 id="currentArtistName" style="margin-bottom: 20px; font-size:1.8rem; text-align:center;">Artista</h2>
        <div id="albumsList"></div>
    </div>

    <!-- VISTA 4: LISTA BRANI DEL DISCO -->
    <div id="albumView" class="view container">
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
            <img id="currentAlbumCover" src="" style="width: 100px; height: 100px; border-radius: 8px;">
            <div>
                <h2 id="currentAlbumTitle" style="font-size:1.5rem;">Album</h2>
                <p id="currentAlbumArtist" style="font-size:1.2rem; color:#aaa;">Artista</p>
            </div>
        </div>
        
        <button class="share small" onclick="shareAlbum()" style="margin-bottom: 15px; width: 100%;">🔗 Condividi Disco</button>
        <button class="secondary small admin-only" onclick="fixAlbumTrackNumbers()" style="margin-bottom: 15px; width: 100%;">🔄 Riordina da iTunes</button>
        
        <div id="tracksList" style="margin-top: 20px;"></div>
        <button class="danger admin-only" onclick="deleteCurrentAlbum()" style="margin-top: 30px;">🗑️ Elimina intero disco</button>
    </div>

    <!-- VISTA 5: LETTORE TESTO -->
    <div id="readerView" class="view container">
        <h2 id="readerTitle" style="margin-bottom: 5px; font-size:1.6rem;">Titolo</h2>
        <p id="readerSubtitle" style="margin-bottom: 15px; color:#aaa; font-size:1.2rem;">Artista</p>
        
        <div class="admin-only" style="display:flex; gap:10px; margin-bottom:30px;">
            <button class="secondary small" style="width: 50%;" onclick="editCurrentTrack()">✏️ Modifica Brano</button>
            <button class="danger small" style="width: 50%;" onclick="deleteCurrentTrack()">🗑️ Elimina</button>
        </div>
        
        <button id="btnToggleNote" class="small secondary" style="display:none; margin-bottom:20px; width:100%;" onclick="toggleNote()">ℹ️ Note sulla canzone</button>
        <div id="trackNote" style="display:none; background:var(--surface-color); border-left: 4px solid var(--accent); padding:15px; margin-bottom:20px; border-radius:4px; font-size:1.1rem; line-height:1.4;"></div>

        <div id="lyricsContainer" style="margin-top: 20px;"></div>
    </div>

    <!-- VISTA 6: EDITOR / RICERCA -->
    <div id="editorView" class="view container">
        <h2>Cerca Brano (iTunes)</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchQuery" placeholder="Es. Genesis Firth of Fifth">
            <button class="small" onclick="searchITunes()">Cerca</button>
        </div>
        <div id="searchResults" style="margin-top:10px; margin-bottom: 20px;"></div>

        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">

        <h2>Dati Brano</h2>
        <input type="hidden" id="editId">
        <input type="text" id="editArtist" placeholder="Artista">
        <input type="text" id="editAlbum" placeholder="Album">
        <input type="text" id="editTitle" placeholder="Titolo Brano">
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="editTrackNum" placeholder="N° Traccia" style="width: 50%;">
            <input type="number" id="editYear" placeholder="Anno Uscita" style="width: 50%;">
        </div>
        
        <input type="text" id="editCover" placeholder="URL Copertina (opzionale)">
        <textarea id="editNote" placeholder="Note descrittive della canzone (opzionale)..." style="min-height: 80px; margin-top: 10px;"></textarea>

        <h2 style="margin-top:20px;">Testo Inglese</h2>
        <textarea id="editEn" placeholder="Incolla qui il testo originale riga per riga..."></textarea>
        <h2 style="margin-top:20px;">Traduzione Italiana</h2>
        <textarea id="editIt" placeholder="Incolla qui la traduzione riga per riga..."></textarea>

        <button onclick="saveTrack()" style="margin-top:30px; margin-bottom: 40px;">💾 Salva nel Database</button>
    </div>

    <script>
        // --- CONFIGURAZIONE GITHUB ---
        const GITHUB_REPO_OWNER = "fabiusai"; 
        const GITHUB_REPO_NAME = "lyrics";
        const GITHUB_FILE_PATH = "data.json";
        const GITHUB_BRANCH = "main";

        let currentFileSha = ""; 
        let appData = { tracks: [] }; 
        let githubToken = "";

        let historyStack = [];
        let currentArtistSelection = "";
        let currentAlbumSelection = "";
        let currentTrackSelection = null;

        // --- INIZIALIZZAZIONE & GESTIONE URL ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            const albumFromUrl = urlParams.get('album');
            
            // Gestione Token sicuro
            if (tokenFromUrl) {
                localStorage.setItem('gh_lyrics_token', tokenFromUrl);
                // Pulisce il token dall'URL ma preserva l'album da condividere se presente
                let cleanUrl = window.location.pathname;
                if(albumFromUrl) cleanUrl += '?album=' + encodeURIComponent(albumFromUrl);
                window.history.replaceState({}, document.title, cleanUrl);
            }
            
            githubToken = localStorage.getItem('gh_lyrics_token');
            loadDataFromGitHub(githubToken, albumFromUrl);
        };

        function showView(viewId, pushHistory = true) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            if (pushHistory && historyStack[historyStack.length - 1] !== viewId) {
                historyStack.push(viewId);
            }

            const btnBack = document.getElementById('btnBack');
            const btnAddTop = document.getElementById('btnAddTop');
            const appTitle = document.getElementById('appTitle');

            if (viewId === 'homeView') {
                btnBack.style.visibility = 'hidden';
                btnBack.style.display = 'block';
                btnAddTop.style.display = 'block';
                appTitle.innerText = "I Miei Artisti";
                renderHome();
            } else if (viewId === 'loginView') {
                btnBack.style.visibility = 'hidden';
                btnAddTop.style.display = 'none';
                appTitle.innerText = "Login";
            } else {
                btnBack.style.display = 'block';
                btnBack.style.visibility = 'visible';
                btnAddTop.style.display = 'none';
                if(viewId === 'artistView') appTitle.innerText = "Dischi Artista";
                if(viewId === 'albumView') appTitle.innerText = "Brani Disco";
                if(viewId === 'readerView') appTitle.innerText = "Lettura Testo";
                if(viewId === 'editorView') appTitle.innerText = "Dati Brano";
            }
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop(); 
                const prevView = historyStack.pop(); 
                showView(prevView);
            } else {
                showView('homeView');
            }
        }

        function showLoader(show) { document.getElementById('loader').style.display = show ? 'block' : 'none'; }

        function saveTokenAndStart() {
            const token = document.getElementById('tokenInput').value.trim();
            if(token) {
                localStorage.setItem('gh_lyrics_token', token);
                githubToken = token;
                loadDataFromGitHub(githubToken);
            } else { alert("Inserisci un token valido."); }
        }

        // --- LETTURA DATI: API (ADMIN) O DIRETTA (AMICI) ---
        async function loadDataFromGitHub(token, albumToOpen = null) {
            showLoader(true);
            
            // Attiva la modalità Sola Lettura se non c'è il token
            document.body.classList.toggle('read-only-mode', !token);
            
            try {
                if (token) {
                    // Chiamata API (Permette la successiva scrittura)
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}?ref=${GITHUB_BRANCH}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (!res.ok) {
                        appData = { tracks: [] }; 
                    } else {
                        const data = await res.json();
                        currentFileSha = data.sha;
                        const decodedContent = decodeURIComponent(escape(atob(data.content)));
                        appData = JSON.parse(decodedContent);
                    }
                } else {
                    // Chiamata Diretta Pubblica (Bypass API, ideale per gli amici)
                    const res = await fetch('./data.json?t=' + Date.now());
                    if (res.ok) {
                        appData = await res.json();
                    } else {
                        console.warn("Database pubblico non trovato. Modalità vuota.");
                        appData = { tracks: [] };
                    }
                }
                
                if (!appData.tracks) appData.tracks = [];
                
                historyStack = [];
                showView('homeView');
                
                // Se il link conteneva un album condiviso, aprilo subito
                if (albumToOpen) {
                    openAlbum(albumToOpen);
                }

            } catch (error) {
                console.error(error);
                if(token) {
                    alert("Errore di connessione API. Controlla il Token.");
                    localStorage.removeItem('gh_lyrics_token');
                    document.body.classList.add('read-only-mode');
                }
            }
            showLoader(false);
        }

        // --- SALVATAGGIO DATI (SOLO ADMIN) ---
        async function saveDataToGitHub() {
            showLoader(true);
            try {
                const jsonString = JSON.stringify(appData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));
                const payload = {
                    message: "Aggiornamento brani (v1.4)",
                    content: contentEncoded,
                    branch: GITHUB_BRANCH
                };
                if (currentFileSha) payload.sha = currentFileSha;

                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const data = await res.json();
                    currentFileSha = data.content.sha;
                    alert("Salvataggio completato!");
                    showView('homeView');
                } else {
                    const errorData = await res.json();
                    throw new Error(errorData.message || "Errore sconosciuto");
                }
            } catch (error) { alert("ERRORE GITHUB: " + error.message); }
            showLoader(false);
        }

        // --- RENDER HOME (ARTISTI) ---
        function renderHome() {
            const listDiv = document.getElementById('artistsList');
            if(!listDiv) return;
            listDiv.innerHTML = "";
            const query = (document.getElementById('localSearchQuery').value || "").toLowerCase();
            
            const artistsMap = {};
            appData.tracks.forEach(track => {
                if(!artistsMap[track.artist]) {
                    artistsMap[track.artist] = { name: track.artist, albums: new Set(), tracksCount: 0 };
                }
                artistsMap[track.artist].albums.add(track.album);
                artistsMap[track.artist].tracksCount++;
            });

            let artistsArr = Object.values(artistsMap);
            if(artistsArr.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; margin-top:20px; color:#aaa;'>Nessun brano nel database.</p>";
                return;
            }

            artistsArr.sort((a, b) => a.name.localeCompare(b.name));

            let found = 0;
            artistsArr.forEach(art => {
                const matchArtist = art.name.toLowerCase().includes(query);
                const matchDeep = appData.tracks.some(t => t.artist === art.name && (t.title.toLowerCase().includes(query) || t.album.toLowerCase().includes(query)));
                if (query && !matchArtist && !matchDeep) return;

                found++;
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <div class="list-item-info">
                        <h2>${art.name}</h2>
                        <p>${art.albums.size} dischi • ${art.tracksCount} brani</p>
                    </div>
                `;
                div.onclick = () => openArtist(art.name);
                listDiv.appendChild(div);
            });

            if (found === 0) listDiv.innerHTML = "<p style='text-align:center; margin-top:20px; color:#aaa;'>Nessun risultato trovato.</p>";
        }

        // --- RENDER ARTISTA (DISCHI) ---
        function openArtist(artistName) {
            currentArtistSelection = artistName;
            document.getElementById('currentArtistName').innerText = artistName;
            
            const listDiv = document.getElementById('albumsList');
            listDiv.innerHTML = "";
            
            const artistTracks = appData.tracks.filter(t => t.artist === artistName);
            const albumsMap = {};
            
            artistTracks.forEach(track => {
                if(!albumsMap[track.album]) {
                    albumsMap[track.album] = {
                        title: track.album,
                        artist: track.artist,
                        cover: track.cover || '',
                        year: track.year || '9999',
                        tracksCount: 0
                    };
                }
                if(track.year && parseInt(track.year) < parseInt(albumsMap[track.album].year)) {
                    albumsMap[track.album].year = track.year;
                }
                if(!albumsMap[track.album].cover && track.cover) {
                    albumsMap[track.album].cover = track.cover;
                }
                albumsMap[track.album].tracksCount++;
            });

            let albumsArr = Object.values(albumsMap);
            albumsArr.sort((a, b) => {
                if (a.year !== b.year) return parseInt(a.year) - parseInt(b.year);
                return a.title.localeCompare(b.title);
            });

            albumsArr.forEach(alb => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const yearBadge = alb.year !== '9999' ? `(${alb.year})` : '';
                div.innerHTML = `
                    <img src="${alb.cover || 'https://via.placeholder.com/150/333333/FFFFFF?text=No+Cover'}" alt="Cover">
                    <div class="list-item-info">
                        <h2>${alb.title} <span style="font-size:1rem; color:#aaa;">${yearBadge}</span></h2>
                        <p>${alb.tracksCount} brani</p>
                    </div>
                `;
                div.onclick = () => openAlbum(alb.title + "|||" + alb.artist);
                listDiv.appendChild(div);
            });
            
            showView('artistView');
        }

        // --- RENDER DISCO E CONDIVISIONE ---
        function openAlbum(albumKey) {
            currentAlbumSelection = albumKey;
            const [albumTitle, albumArtist] = albumKey.split("|||");
            const tracks = appData.tracks.filter(t => t.album === albumTitle && t.artist === albumArtist);
            
            let cover = 'https://via.placeholder.com/150/333333/FFFFFF?text=No+Cover';
            let year = '9999';
            tracks.forEach(t => {
                if(t.cover) cover = t.cover;
                if(t.year && parseInt(t.year) < parseInt(year)) year = t.year;
            });
            
            document.getElementById('currentAlbumCover').src = cover;
            document.getElementById('currentAlbumTitle').innerText = albumTitle;
            const yearBadge = year !== '9999' ? `(${year})` : '';
            document.getElementById('currentAlbumArtist').innerText = `${albumArtist} ${yearBadge}`;

            const listDiv = document.getElementById('tracksList');
            listDiv.innerHTML = "";
            
            tracks.sort((a, b) => {
                const numA = parseInt(a.trackNum) || 999;
                const numB = parseInt(b.trackNum) || 999;
                return numA - numB;
            });

            tracks.forEach(track => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const prefix = track.trackNum ? `${track.trackNum}. ` : '';
                div.innerHTML = `
                    <div class="list-item-info" style="width: 100%;">
                        <h2 style="font-size: 1.3rem;">${prefix}${track.title}</h2>
                    </div>
                `;
                div.onclick = () => openReader(track.id);
                listDiv.appendChild(div);
            });
            
            showView('albumView');
        }

        function shareAlbum() {
            if(!currentAlbumSelection) return;
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = baseUrl + '?album=' + encodeURIComponent(currentAlbumSelection);
            const titleText = currentAlbumSelection.split("|||")[0] + " - " + currentAlbumSelection.split("|||")[1];
            
            if (navigator.share) {
                navigator.share({
                    title: 'Lyrics Reader: ' + titleText,
                    url: shareUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert("Link copiato! Ora puoi incollarlo su WhatsApp o dove preferisci.");
                }).catch(() => {
                    prompt("Copia questo link:", shareUrl);
                });
            }
        }

        // --- GESTIONE NOTE ---
        function toggleNote() {
            const noteDiv = document.getElementById('trackNote');
            if(noteDiv.style.display === 'none') {
                noteDiv.style.display = 'block';
            } else {
                noteDiv.style.display = 'none';
            }
        }

        // --- RENDER TESTO BRANO ---
        function openReader(trackId) {
            currentTrackSelection = appData.tracks.find(t => t.id === trackId);
            if(!currentTrackSelection) return;

            const prefix = currentTrackSelection.trackNum ? `${currentTrackSelection.trackNum}. ` : '';
            document.getElementById('readerTitle').innerText = prefix + currentTrackSelection.title;
            document.getElementById('readerSubtitle').innerText = `${currentTrackSelection.artist} • ${currentTrackSelection.album}`;

            const btnNote = document.getElementById('btnToggleNote');
            const divNote = document.getElementById('trackNote');
            divNote.style.display = 'none'; // Sempre chiusa di default
            if (currentTrackSelection.note && currentTrackSelection.note.trim() !== '') {
                btnNote.style.display = 'block';
                divNote.innerHTML = currentTrackSelection.note.replace(/\n/g, '<br>');
            } else {
                btnNote.style.display = 'none';
                divNote.innerHTML = '';
            }

            const container = document.getElementById('lyricsContainer');
            container.innerHTML = "";
            const enLines = currentTrackSelection.en.split('\n');
            const itLines = currentTrackSelection.it.split('\n');
            const maxLines = Math.max(enLines.length, itLines.length);

            for (let i = 0; i < maxLines; i++) {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'lyric-pair';
                const enText = enLines[i] || '';
                const itText = itLines[i] || '';

                if (enText.trim() !== '' || itText.trim() !== '') {
                    pairDiv.innerHTML = `<div class="lyric-en">${enText}</div><div class="lyric-it">${itText}</div>`;
                    container.appendChild(pairDiv);
                } else {
                    pairDiv.innerHTML = `<div style="height:25px;"></div>`;
                    container.appendChild(pairDiv);
                }
            }
            showView('readerView');
        }

        // --- GESTIONE EDITOR (SOLO ADMIN) ---
        function prepareNewTrack() {
            document.getElementById('editId').value = '';
            document.getElementById('editArtist').value = currentArtistSelection || '';
            document.getElementById('editAlbum').value = currentAlbumSelection ? currentAlbumSelection.split("|||")[0] : '';
            document.getElementById('editTitle').value = '';
            document.getElementById('editTrackNum').value = '';
            document.getElementById('editYear').value = '';
            document.getElementById('editCover').value = '';
            document.getElementById('editNote').value = '';
            document.getElementById('editEn').value = '';
            document.getElementById('editIt').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
            showView('editorView');
        }

        function editCurrentTrack() {
            if(!currentTrackSelection) return;
            document.getElementById('editId').value = currentTrackSelection.id;
            document.getElementById('editArtist').value = currentTrackSelection.artist;
            document.getElementById('editAlbum').value = currentTrackSelection.album;
            document.getElementById('editTitle').value = currentTrackSelection.title;
            document.getElementById('editTrackNum').value = currentTrackSelection.trackNum || '';
            document.getElementById('editYear').value = currentTrackSelection.year || '';
            document.getElementById('editCover').value = currentTrackSelection.cover || '';
            document.getElementById('editNote').value = currentTrackSelection.note || '';
            document.getElementById('editEn').value = currentTrackSelection.en;
            document.getElementById('editIt').value = currentTrackSelection.it;
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
            showView('editorView');
        }

        async function searchITunes() {
            const query = document.getElementById('searchQuery').value.trim();
            if(!query) return;
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "Ricerca in corso...";
            
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
                const data = await res.json();
                resultsDiv.innerHTML = "";
                if(data.results.length === 0) { resultsDiv.innerHTML = "Nessun risultato trovato."; return; }

                data.results.forEach(song => {
                    const btn = document.createElement('button');
                    btn.className = 'secondary small';
                    btn.style.margin = "5px 0";
                    btn.style.textAlign = "left";
                    btn.innerHTML = `🎵 ${song.trackName} - ${song.artistName} (${song.collectionName})`;
                    btn.onclick = () => {
                        document.getElementById('editArtist').value = song.artistName;
                        document.getElementById('editAlbum').value = song.collectionName;
                        document.getElementById('editTitle').value = song.trackName;
                        document.getElementById('editTrackNum').value = song.trackNumber || '';
                        document.getElementById('editYear').value = song.releaseDate ? song.releaseDate.substring(0,4) : '';
                        document.getElementById('editCover').value = song.artworkUrl100.replace('100x100bb', '600x600bb');
                        resultsDiv.innerHTML = "<span style='color:var(--accent);'>Dati compilati!</span>";
                    };
                    resultsDiv.appendChild(btn);
                });
            } catch (error) { resultsDiv.innerHTML = "Errore durante la ricerca."; }
        }
        
        async function fixAlbumTrackNumbers() {
            if(!currentAlbumSelection) return;
            const [album, artist] = currentAlbumSelection.split("|||");
            if(!confirm("Vuoi cercare automaticamente i numeri di traccia su iTunes per riordinare il disco?")) return;
            
            showLoader(true);
            try {
                const query = artist + " " + album;
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=50`);
                const data = await res.json();
                
                let updated = 0;
                appData.tracks.forEach(t => {
                    if(t.album === album && t.artist === artist) {
                        const itunesMatch = data.results.find(r => r.trackName.toLowerCase().includes(t.title.toLowerCase()) || t.title.toLowerCase().includes(r.trackName.toLowerCase()));
                        if(itunesMatch && itunesMatch.trackNumber) {
                            t.trackNum = itunesMatch.trackNumber;
                            updated++;
                        }
                    }
                });
                
                if(updated > 0) { await saveDataToGitHub(); } 
                else { alert("Nessun nuovo ordine trovato."); showLoader(false); }
            } catch (error) { alert("Errore durante la ricerca."); showLoader(false); }
        }

        function saveTrack() {
            const id = document.getElementById('editId').value;
            const artist = document.getElementById('editArtist').value.trim();
            const album = document.getElementById('editAlbum').value.trim();
            const title = document.getElementById('editTitle').value.trim();
            const trackNum = document.getElementById('editTrackNum').value.trim();
            const year = document.getElementById('editYear').value.trim();
            const cover = document.getElementById('editCover').value.trim();
            const note = document.getElementById('editNote').value.trim();
            const en = document.getElementById('editEn').value;
            const it = document.getElementById('editIt').value;

            if(!artist || !album || !title || !en) {
                alert("Artista, Album, Titolo e Testo Inglese sono obbligatori!");
                return;
            }

            if (id) {
                const idx = appData.tracks.findIndex(t => t.id === id);
                if (idx !== -1) appData.tracks[idx] = { id, artist, album, title, trackNum, year, cover, note, en, it };
            } else {
                appData.tracks.push({ id: Date.now().toString(), artist, album, title, trackNum, year, cover, note, en, it });
            }
            saveDataToGitHub();
        }

        function deleteCurrentTrack() {
            if(!currentTrackSelection) return;
            if(confirm("Sei sicuro di voler eliminare questo brano?")) {
                appData.tracks = appData.tracks.filter(t => t.id !== currentTrackSelection.id);
                saveDataToGitHub();
            }
        }

        function deleteCurrentAlbum() {
            if(!currentAlbumSelection) return;
            if(confirm("Sei sicuro di voler eliminare l'INTERO DISCO?")) {
                const [album, artist] = currentAlbumSelection.split("|||");
                appData.tracks = appData.tracks.filter(t => !(t.album === album && t.artist === artist));
                saveDataToGitHub();
            }
        }
    </script>
</body>
