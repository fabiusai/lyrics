<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lyrics Reader</title>
    <style>
        /* CSS: DARK MODE DEFAULT, FONT GRANDI, UI MOBILE */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-main: #ffffff;
            --text-it: #ffca28; /* Giallo per l'italiano */
            --accent: #1db954; /* Verde stile Spotify */
            --danger: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px; /* Spazio per evitare navbar di iOS */
        }

        header {
            background-color: var(--surface-color);
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container { padding: 20px; }
        
        /* Utility per nascondere le viste */
        .view { display: none; }
        .view.active { display: block; }

        /* Bottoni: Grandi e facili da premere */
        button {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: var(--accent);
            color: #fff;
            margin-top: 10px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        button.secondary { background-color: #333; }
        button.danger { background-color: var(--danger); }
        button.small { width: auto; padding: 10px 15px; font-size: 1rem; }

        /* Input e Textarea: Grandi e leggibili */
        input, textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: var(--surface-color);
            color: var(--text-main);
        }
        textarea { min-height: 150px; resize: vertical; }

        /* Liste Album e Brani */
        .list-item {
            background-color: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }
        .list-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .list-item-info h2 { font-size: 1.4rem; margin-bottom: 5px; }
        .list-item-info p { font-size: 1.1rem; color: #aaa; }

        /* Stile Lettore Testi */
        .lyric-pair { margin-bottom: 25px; }
        .lyric-en { font-size: 1.6rem; font-weight: bold; line-height: 1.3; }
        .lyric-it { font-size: 1.4rem; color: var(--text-it); line-height: 1.3; margin-top: 8px; font-style: italic; }

        /* Feedback UI */
        #loader { display: none; text-align: center; padding: 20px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <button class="small secondary" id="btnBack" style="display:none;" onclick="goBack()">◀ Indietro</button>
        <span id="appTitle">Lyrics Reader</span>
        <button class="small secondary" id="btnAddTop" style="display:none;" onclick="prepareNewTrack()">➕</button>
    </header>

    <div id="loader">Attendere prego...</div>

    <!-- VISTA 1: LOGIN (Mostrata solo se manca il token) -->
    <div id="loginView" class="view container">
        <h2>Imposta Token GitHub</h2>
        <p style="margin-top:10px; color:#aaa; font-size:1.1rem;">Inserisci il tuo Personal Access Token. (Puoi anche aggiungerlo all'URL con ?token=...)</p>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxx">
        <button onclick="saveTokenAndStart()">Salva e Accedi</button>
    </div>

    <!-- VISTA 2: LISTA DISCHI (Home) -->
    <div id="homeView" class="view container">
        <button onclick="prepareNewTrack()" style="margin-bottom: 20px;">➕ Aggiungi Nuovo Brano</button>
        <input type="text" id="localSearchQuery" placeholder="🔍 Cerca artista, disco o brano..." onkeyup="renderHome()">
        <div id="albumsList" style="margin-top: 20px;"></div>
    </div>

    <!-- VISTA 3: LISTA BRANI DEL DISCO -->
    <div id="albumView" class="view container">
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
            <img id="currentAlbumCover" src="" style="width: 100px; height: 100px; border-radius: 8px;">
            <div>
                <h2 id="currentAlbumTitle" style="font-size:1.5rem;">Album</h2>
                <p id="currentAlbumArtist" style="font-size:1.2rem; color:#aaa;">Artista</p>
            </div>
        </div>
        <div id="tracksList"></div>
        <button class="danger" onclick="deleteCurrentAlbum()" style="margin-top: 30px;">🗑️ Elimina intero disco</button>
    </div>

    <!-- VISTA 4: LETTORE TESTO -->
    <div id="readerView" class="view container">
        <h2 id="readerTitle" style="margin-bottom: 5px; font-size:1.6rem;">Titolo</h2>
        <p id="readerSubtitle" style="margin-bottom: 25px; color:#aaa; font-size:1.2rem;">Artista</p>
        <div id="lyricsContainer"></div>
        
        <div style="display:flex; gap:10px; margin-top:40px;">
            <button class="secondary" onclick="editCurrentTrack()">✏️ Modifica</button>
            <button class="danger" onclick="deleteCurrentTrack()">🗑️ Elimina</button>
        </div>
    </div>

    <!-- VISTA 5: EDITOR / RICERCA -->
    <div id="editorView" class="view container">
        <h2>Cerca Brano (iTunes)</h2>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchQuery" placeholder="Es. Genesis Firth of Fifth">
            <button class="small" onclick="searchITunes()">Cerca</button>
        </div>
        <div id="searchResults" style="margin-top:10px; margin-bottom: 20px;"></div>

        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">

        <h2>Dati Brano</h2>
        <input type="hidden" id="editId">
        <input type="text" id="editArtist" placeholder="Artista">
        <input type="text" id="editAlbum" placeholder="Album">
        <input type="text" id="editTitle" placeholder="Titolo Brano">
        
        <div style="display: flex; gap: 10px;">
            <input type="number" id="editTrackNum" placeholder="N° Traccia" style="width: 50%;">
            <input type="number" id="editYear" placeholder="Anno Uscita" style="width: 50%;">
        </div>
        
        <input type="text" id="editCover" placeholder="URL Copertina (opzionale)">
        
        <h2 style="margin-top:20px;">Testo Inglese</h2>
        <textarea id="editEn" placeholder="Incolla qui il testo originale riga per riga..."></textarea>

        <h2 style="margin-top:20px;">Traduzione Italiana</h2>
        <textarea id="editIt" placeholder="Incolla qui la traduzione riga per riga... (Assicurati che abbia lo stesso numero di righe dell'inglese)"></textarea>

        <button onclick="saveTrack()" style="margin-top:30px; margin-bottom: 40px;">💾 Salva nel Database</button>
    </div>

    <script>
        // --- CONFIGURAZIONE GITHUB ---
        const GITHUB_REPO_OWNER = "fabiusai"; 
        const GITHUB_REPO_NAME = "lyrics";
        const GITHUB_FILE_PATH = "data.json";
        const GITHUB_BRANCH = "main";

        let currentFileSha = ""; 
        let appData = { tracks: [] }; 
        let githubToken = "";

        // Gestione Navigazione
        let historyStack = [];
        let currentAlbumSelection = "";
        let currentTrackSelection = null;

        // --- INIZIALIZZAZIONE ---
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            if (tokenFromUrl) {
                localStorage.setItem('gh_lyrics_token', tokenFromUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            githubToken = localStorage.getItem('gh_lyrics_token');
            if (githubToken) {
                loadDataFromGitHub(githubToken);
            } else {
                showView('loginView');
            }
        };

        // --- GESTIONE VISTE E PULIZIA ---
        function showView(viewId, pushHistory = true) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            if (pushHistory && historyStack[historyStack.length - 1] !== viewId) {
                historyStack.push(viewId);
            }

            const btnBack = document.getElementById('btnBack');
            const btnAddTop = document.getElementById('btnAddTop');
            const appTitle = document.getElementById('appTitle');

            if (viewId === 'homeView') {
                btnBack.style.display = 'none';
                btnAddTop.style.display = 'block';
                appTitle.innerText = "I Miei Dischi";
                renderHome();
            } else {
                btnBack.style.display = 'block';
                btnAddTop.style.display = 'none';
                if(viewId === 'albumView') appTitle.innerText = "Brani Disco";
                if(viewId === 'readerView') appTitle.innerText = "Lettura";
                if(viewId === 'editorView') appTitle.innerText = "Dati Brano";
            }
        }

        function goBack() {
            if (historyStack.length > 1) {
                historyStack.pop(); 
                const prevView = historyStack.pop(); 
                showView(prevView);
            } else {
                showView('homeView');
            }
        }

        function showLoader(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
        }

        function prepareNewTrack() {
            document.getElementById('editId').value = '';
            document.getElementById('editArtist').value = '';
            document.getElementById('editAlbum').value = '';
            document.getElementById('editTitle').value = '';
            document.getElementById('editTrackNum').value = '';
            document.getElementById('editYear').value = '';
            document.getElementById('editCover').value = '';
            document.getElementById('editEn').value = '';
            document.getElementById('editIt').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
            showView('editorView');
        }

        function editCurrentTrack() {
            if(!currentTrackSelection) return;
            document.getElementById('editId').value = currentTrackSelection.id;
            document.getElementById('editArtist').value = currentTrackSelection.artist;
            document.getElementById('editAlbum').value = currentTrackSelection.album;
            document.getElementById('editTitle').value = currentTrackSelection.title;
            document.getElementById('editTrackNum').value = currentTrackSelection.trackNum || '';
            document.getElementById('editYear').value = currentTrackSelection.year || '';
            document.getElementById('editCover').value = currentTrackSelection.cover || '';
            document.getElementById('editEn').value = currentTrackSelection.en;
            document.getElementById('editIt').value = currentTrackSelection.it;
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
            showView('editorView');
        }

        // --- LOGIN ---
        function saveTokenAndStart() {
            const token = document.getElementById('tokenInput').value.trim();
            if(token) {
                localStorage.setItem('gh_lyrics_token', token);
                githubToken = token;
                loadDataFromGitHub(githubToken);
            } else {
                alert("Inserisci un token valido.");
            }
        }

        // --- FUNZIONI LETTURA/SCRITTURA GITHUB ---
        async function loadDataFromGitHub(token) {
            showLoader(true);
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}?ref=${GITHUB_BRANCH}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                if (!res.ok) {
                    console.warn("File non trovato nel branch main. L'API lo creerà al primo salvataggio.");
                    appData = { tracks: [] }; 
                } else {
                    const data = await res.json();
                    currentFileSha = data.sha;
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    appData = JSON.parse(decodedContent);
                    if (!appData.tracks) appData.tracks = [];
                }
                historyStack = [];
                showView('homeView');
            } catch (error) {
                console.error("Errore di caricamento:", error);
                alert("Errore caricamento dati: " + error.message);
                localStorage.removeItem('gh_lyrics_token');
                showView('loginView');
            }
            showLoader(false);
        }

        async function saveDataToGitHub() {
            showLoader(true);
            try {
                const jsonString = JSON.stringify(appData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

                const payload = {
                    message: "Aggiornamento brani da Web App",
                    content: contentEncoded,
                    branch: GITHUB_BRANCH
                };

                if (currentFileSha) payload.sha = currentFileSha;

                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/${GITHUB_FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    currentFileSha = data.content.sha;
                    alert("Salvataggio completato con successo!");
                    showView('homeView');
                } else {
                    const errorData = await res.json();
                    throw new Error(errorData.message || "Errore sconosciuto");
                }
            } catch (error) {
                console.error(error);
                alert("ERRORE GITHUB: " + error.message);
            }
            showLoader(false);
        }

        // --- LOGICA RENDER APP E ORDINAMENTO ---
        function getAlbumsMap() {
            const map = {};
            appData.tracks.forEach(track => {
                const key = track.album + "|||" + track.artist;
                if(!map[key]) {
                    map[key] = {
                        title: track.album,
                        artist: track.artist,
                        cover: track.cover || '',
                        year: track.year || '9999',
                        tracks: []
                    };
                }
                // Prende l'anno di uscita minore se presente
                if(track.year && parseInt(track.year) < parseInt(map[key].year)) {
                    map[key].year = track.year;
                }
                map[key].tracks.push(track);
            });
            return map;
        }

        function renderHome() {
            const listDiv = document.getElementById('albumsList');
            listDiv.innerHTML = "";
            const query = (document.getElementById('localSearchQuery').value || "").toLowerCase();
            const albums = getAlbumsMap();
            let albumsArr = Object.values(albums);
            
            if(albumsArr.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; margin-top:20px; color:#aaa;'>Nessun disco presente. Aggiungine uno!</p>";
                return;
            }

            // Ordina per anno (crescente) e poi per artista
            albumsArr.sort((a, b) => {
                if (a.year !== b.year) return parseInt(a.year) - parseInt(b.year);
                return a.artist.localeCompare(b.artist);
            });

            let found = 0;
            albumsArr.forEach(alb => {
                // Filtro Ricerca
                const matchAlbum = alb.title.toLowerCase().includes(query);
                const matchArtist = alb.artist.toLowerCase().includes(query);
                const matchTrack = alb.tracks.some(t => t.title.toLowerCase().includes(query));

                if (query && !matchAlbum && !matchArtist && !matchTrack) return;

                found++;
                const div = document.createElement('div');
                div.className = 'list-item';
                const yearBadge = alb.year !== '9999' ? `(${alb.year})` : '';
                
                div.innerHTML = `
                    <img src="${alb.cover || 'https://via.placeholder.com/150/333333/FFFFFF?text=No+Cover'}" alt="Cover">
                    <div class="list-item-info">
                        <h2>${alb.title} <span style="font-size:1rem; color:#aaa;">${yearBadge}</span></h2>
                        <p>${alb.artist} • ${alb.tracks.length} brani</p>
                    </div>
                `;
                div.onclick = () => openAlbum(alb.title + "|||" + alb.artist);
                listDiv.appendChild(div);
            });

            if (found === 0) {
                listDiv.innerHTML = "<p style='text-align:center; margin-top:20px; color:#aaa;'>Nessun risultato trovato nel database.</p>";
            }
        }

        function openAlbum(albumKey) {
            currentAlbumSelection = albumKey;
            const alb = getAlbumsMap()[albumKey];
            
            document.getElementById('currentAlbumCover').src = alb.cover || 'https://via.placeholder.com/150/333333/FFFFFF?text=No+Cover';
            document.getElementById('currentAlbumTitle').innerText = alb.title;
            const yearBadge = alb.year !== '9999' ? `(${alb.year})` : '';
            document.getElementById('currentAlbumArtist').innerText = `${alb.artist} ${yearBadge}`;

            const listDiv = document.getElementById('tracksList');
            listDiv.innerHTML = "";
            
            // Ordina i brani del disco in base al trackNum (se disponibile)
            alb.tracks.sort((a, b) => {
                const numA = parseInt(a.trackNum) || 999;
                const numB = parseInt(b.trackNum) || 999;
                return numA - numB;
            });

            alb.tracks.forEach(track => {
                const div = document.createElement('div');
                div.className = 'list-item';
                const prefix = track.trackNum ? `${track.trackNum}. ` : '';
                div.innerHTML = `
                    <div class="list-item-info" style="width: 100%;">
                        <h2 style="font-size: 1.3rem;">${prefix}${track.title}</h2>
                    </div>
                `;
                div.onclick = () => openReader(track.id);
                listDiv.appendChild(div);
            });
            
            showView('albumView');
        }

        function openReader(trackId) {
            currentTrackSelection = appData.tracks.find(t => t.id === trackId);
            if(!currentTrackSelection) return;

            const prefix = currentTrackSelection.trackNum ? `${currentTrackSelection.trackNum}. ` : '';
            document.getElementById('readerTitle').innerText = prefix + currentTrackSelection.title;
            document.getElementById('readerSubtitle').innerText = `${currentTrackSelection.artist} • ${currentTrackSelection.album}`;

            const container = document.getElementById('lyricsContainer');
            container.innerHTML = "";

            const enLines = currentTrackSelection.en.split('\n');
            const itLines = currentTrackSelection.it.split('\n');
            const maxLines = Math.max(enLines.length, itLines.length);

            for (let i = 0; i < maxLines; i++) {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'lyric-pair';
                
                const enText = enLines[i] || '';
                const itText = itLines[i] || '';

                if (enText.trim() !== '' || itText.trim() !== '') {
                    pairDiv.innerHTML = `
                        <div class="lyric-en">${enText}</div>
                        <div class="lyric-it">${itText}</div>
                    `;
                    container.appendChild(pairDiv);
                } else {
                    pairDiv.innerHTML = `<div style="height:25px;"></div>`;
                    container.appendChild(pairDiv);
                }
            }
            showView('readerView');
        }

        // --- EDITOR E RICERCA ITUNES ---
        async function searchITunes() {
            const query = document.getElementById('searchQuery').value.trim();
            if(!query) return;
            
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = "Ricerca in corso...";
            
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
                const data = await res.json();
                
                resultsDiv.innerHTML = "";
                if(data.results.length === 0) {
                    resultsDiv.innerHTML = "Nessun risultato trovato.";
                    return;
                }

                data.results.forEach(song => {
                    const btn = document.createElement('button');
                    btn.className = 'secondary small';
                    btn.style.margin = "5px 0";
                    btn.style.textAlign = "left";
                    btn.innerHTML = `🎵 ${song.trackName} - ${song.artistName} (${song.collectionName})`;
                    btn.onclick = () => {
                        document.getElementById('editArtist').value = song.artistName;
                        document.getElementById('editAlbum').value = song.collectionName;
                        document.getElementById('editTitle').value = song.trackName;
                        document.getElementById('editTrackNum').value = song.trackNumber || '';
                        document.getElementById('editYear').value = song.releaseDate ? song.releaseDate.substring(0,4) : '';
                        document.getElementById('editCover').value = song.artworkUrl100.replace('100x100bb', '600x600bb');
                        resultsDiv.innerHTML = "<span style='color:var(--accent);'>Dati compilati!</span>";
                    };
                    resultsDiv.appendChild(btn);
                });
            } catch (error) {
                resultsDiv.innerHTML = "Errore durante la ricerca.";
            }
        }

        function saveTrack() {
            const id = document.getElementById('editId').value;
            const artist = document.getElementById('editArtist').value.trim();
            const album = document.getElementById('editAlbum').value.trim();
            const title = document.getElementById('editTitle').value.trim();
            const trackNum = document.getElementById('editTrackNum').value.trim();
            const year = document.getElementById('editYear').value.trim();
            const cover = document.getElementById('editCover').value.trim();
            const en = document.getElementById('editEn').value;
            const it = document.getElementById('editIt').value;

            if(!artist || !album || !title || !en) {
                alert("Artista, Album, Titolo e Testo Inglese sono obbligatori!");
                return;
            }

            if (id) {
                // Aggiornamento brano esistente
                const idx = appData.tracks.findIndex(t => t.id === id);
                if (idx !== -1) {
                    appData.tracks[idx] = { id, artist, album, title, trackNum, year, cover, en, it };
                }
            } else {
                // Creazione nuovo brano
                const newTrack = {
                    id: Date.now().toString(),
                    artist, album, title, trackNum, year, cover, en, it
                };
                appData.tracks.push(newTrack);
            }

            saveDataToGitHub();
        }

        // --- ELIMINAZIONE ---
        function deleteCurrentTrack() {
            if(!currentTrackSelection) return;
            if(confirm("Sei sicuro di voler eliminare questo brano?")) {
                appData.tracks = appData.tracks.filter(t => t.id !== currentTrackSelection.id);
                saveDataToGitHub();
            }
        }

        function deleteCurrentAlbum() {
            if(!currentAlbumSelection) return;
            if(confirm("Sei sicuro di voler eliminare l'INTERO DISCO?")) {
                const [album, artist] = currentAlbumSelection.split("|||");
                appData.tracks = appData.tracks.filter(t => !(t.album === album && t.artist === artist));
                saveDataToGitHub();
            }
        }
    </script>
</body>
</html>
